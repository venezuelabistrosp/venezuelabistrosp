name: Daily Venezuelan Gastronomy Research

on:
  schedule:
    # Run daily at 17:00 UTC (14:00 Brasilia Time)
    - cron: '0 17 * * *'
  workflow_dispatch:
    # Enable manual triggering from the Actions tab

jobs:
  run-research:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit and push changes back to repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pydantic pillow

      - name: Run Cloud Research Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 465
        run: |
          python cloud_research.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage changes
          git add scraped_data.json trends.js last_report.md
          
          # Stage newly generated PNG images (if any)
          git add *.png
          
          # Commit only if changes exist
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated daily culinary trend update [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
